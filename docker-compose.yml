services:
  mongodb:
    image: mongo:7
    restart: unless-stopped
    ports:
      - "127.0.0.1:27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-local-development-password}
      MONGO_INITDB_DATABASE: ${MONGO_DATABASE:-v0-by-kimi}
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          mongosh --quiet
          --username "$$MONGO_INITDB_ROOT_USERNAME"
          --password "$$MONGO_INITDB_ROOT_PASSWORD"
          --authenticationDatabase admin
          --eval "quit(db.adminCommand('ping').ok ? 0 : 1)"
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - mongodb_data:/data/db
    networks:
      - v0-network

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - v0-network

  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    restart: unless-stopped
    ports:
      - "${API_PORT:-3001}:3001"
    environment:
      PORT: "3001"
      MONGODB_URI: mongodb://${MONGO_ROOT_USERNAME:-admin}:${MONGO_ROOT_PASSWORD:-local-development-password}@mongodb:27017/${MONGO_DATABASE:-v0-by-kimi}?authSource=admin
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-local-development-only-change-before-deploying}
      CLIENT_URL: ${CLIENT_URL:-http://localhost:3000}
      PREVIEW_PUBLIC_ORIGIN: ${PREVIEW_PUBLIC_ORIGIN:-http://localhost:3001}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-v4-flash}
      AGENT_QUEUE_NAME: ${AGENT_QUEUE_NAME:-v0-agent-runs}
      AGENT_MODEL: ${AGENT_MODEL:-}
      AGENT_MAX_REPAIR_ATTEMPTS: ${AGENT_MAX_REPAIR_ATTEMPTS:-2}
      AGENT_VALIDATION_EXECUTOR: ${AGENT_VALIDATION_EXECUTOR:-legacy}
      ARTIFACT_STORE_DRIVER: shared-filesystem
      ARTIFACT_STORE_ROOT: /var/lib/open-v0/artifacts
      SANDBOX_PROVIDER: ${SANDBOX_PROVIDER:-fake}
      SANDBOX_LOCAL_ENABLED: "${SANDBOX_LOCAL_ENABLED:-false}"
      NODE_ENV: production
    volumes:
      - agent_validation_cache:/var/cache/v0-agent
      - artifact_store:/var/lib/open-v0/artifacts
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3001/health"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - v0-network

  worker:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    restart: unless-stopped
    command: npm run start:worker --workspace @v0/server
    environment:
      MONGODB_URI: mongodb://${MONGO_ROOT_USERNAME:-admin}:${MONGO_ROOT_PASSWORD:-local-development-password}@mongodb:27017/${MONGO_DATABASE:-v0-by-kimi}?authSource=admin
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-local-development-only-change-before-deploying}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-v4-flash}
      AGENT_QUEUE_NAME: ${AGENT_QUEUE_NAME:-v0-agent-runs}
      AGENT_MODEL: ${AGENT_MODEL:-}
      AGENT_MAX_REPAIR_ATTEMPTS: ${AGENT_MAX_REPAIR_ATTEMPTS:-2}
      AGENT_VALIDATION_EXECUTOR: ${AGENT_VALIDATION_EXECUTOR:-legacy}
      AGENT_WORKSPACE_ROOT: ${AGENT_WORKSPACE_ROOT:-/tmp/v0-agent-runs}
      AGENT_CONTEXT_CHAR_LIMIT: ${AGENT_CONTEXT_CHAR_LIMIT:-120000}
      AGENT_VALIDATION_STRUCTURE_TIMEOUT_MS: ${AGENT_VALIDATION_STRUCTURE_TIMEOUT_MS:-5000}
      AGENT_VALIDATION_CACHE_HIT_TIMEOUT_MS: ${AGENT_VALIDATION_CACHE_HIT_TIMEOUT_MS:-15000}
      AGENT_VALIDATION_INSTALL_TIMEOUT_MS: ${AGENT_VALIDATION_INSTALL_TIMEOUT_MS:-180000}
      AGENT_VALIDATION_TYPE_CHECK_TIMEOUT_MS: ${AGENT_VALIDATION_TYPE_CHECK_TIMEOUT_MS:-60000}
      AGENT_VALIDATION_BUILD_TIMEOUT_MS: ${AGENT_VALIDATION_BUILD_TIMEOUT_MS:-120000}
      AGENT_VALIDATION_ROUND_TIMEOUT_MS: ${AGENT_VALIDATION_ROUND_TIMEOUT_MS:-300000}
      AGENT_VALIDATION_INFRA_RETRY_DELAYS_MS: ${AGENT_VALIDATION_INFRA_RETRY_DELAYS_MS:-5000,15000}
      AGENT_VALIDATION_NPM_CACHE_ROOT: /var/cache/v0-agent/npm
      AGENT_VALIDATION_DEPENDENCY_CACHE_ROOT: /var/cache/v0-agent/dependencies
      AGENT_VALIDATION_CACHE_RETENTION_MS: ${AGENT_VALIDATION_CACHE_RETENTION_MS:-604800000}
      AGENT_VALIDATION_CACHE_MAX_BYTES: ${AGENT_VALIDATION_CACHE_MAX_BYTES:-10737418240}
      AGENT_MAX_VALIDATION_OUTPUT_CHARS: ${AGENT_MAX_VALIDATION_OUTPUT_CHARS:-12000}
      ARTIFACT_STORE_DRIVER: shared-filesystem
      ARTIFACT_STORE_ROOT: /var/lib/open-v0/artifacts
      SANDBOX_PROVIDER: ${SANDBOX_PROVIDER:-fake}
      SANDBOX_LOCAL_ENABLED: "${SANDBOX_LOCAL_ENABLED:-false}"
      SANDBOX_LOCAL_ROOT: ${SANDBOX_LOCAL_ROOT:-/tmp/open-v0-sandboxes}
      SANDBOX_ALLOWED_BUILD_IMAGES: ${SANDBOX_ALLOWED_BUILD_IMAGES:-node:22}
      SANDBOX_QUOTA_LOCK_TTL_MS: "${SANDBOX_QUOTA_LOCK_TTL_MS:-5000}"
      SANDBOX_QUOTA_LOCK_WAIT_MS: "${SANDBOX_QUOTA_LOCK_WAIT_MS:-2000}"
      SANDBOX_READINESS_TIMEOUT_MS: "${SANDBOX_READINESS_TIMEOUT_MS:-60000}"
      SANDBOX_LEASE_SECONDS: "${SANDBOX_LEASE_SECONDS:-900}"
      SANDBOX_AUTO_DELETE_SECONDS: "${SANDBOX_AUTO_DELETE_SECONDS:-1800}"
      SANDBOX_ORPHAN_GRACE_MS: "${SANDBOX_ORPHAN_GRACE_MS:-300000}"
      SANDBOX_RECONCILE_INTERVAL_MS: "${SANDBOX_RECONCILE_INTERVAL_MS:-30000}"
      SANDBOX_INSTALL_TIMEOUT_MS: "${SANDBOX_INSTALL_TIMEOUT_MS:-180000}"
      SANDBOX_TYPE_CHECK_TIMEOUT_MS: "${SANDBOX_TYPE_CHECK_TIMEOUT_MS:-60000}"
      SANDBOX_BUILD_TIMEOUT_MS: "${SANDBOX_BUILD_TIMEOUT_MS:-120000}"
      NODE_ENV: production
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - agent_validation_cache:/var/cache/v0-agent
      - artifact_store:/var/lib/open-v0/artifacts
    networks:
      - v0-network

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-3000}:80"
    depends_on:
      server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - v0-network

  artifact-reconciler:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    profiles:
      - maintenance
    restart: "no"
    command: npm run start:reconcile:artifacts --workspace @v0/server
    environment:
      MONGODB_URI: mongodb://${MONGO_ROOT_USERNAME:-admin}:${MONGO_ROOT_PASSWORD:-local-development-password}@mongodb:27017/${MONGO_DATABASE:-v0-by-kimi}?authSource=admin
      ARTIFACT_STORE_DRIVER: shared-filesystem
      ARTIFACT_STORE_ROOT: /var/lib/open-v0/artifacts
      NODE_ENV: production
    volumes:
      - artifact_store:/var/lib/open-v0/artifacts
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - v0-network

volumes:
  mongodb_data:
  agent_validation_cache:
  artifact_store:

networks:
  v0-network:
    driver: bridge
