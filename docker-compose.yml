services:
  mongodb:
    image: mongo:7
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password
      MONGO_INITDB_DATABASE: v0-by-kimi
    volumes:
      - mongodb_data:/data/db
    networks:
      - v0-network

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - v0-network

  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
      - MONGODB_URI=mongodb://admin:password@mongodb:27017/v0-by-kimi?authSource=admin
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=${JWT_SECRET:-your-super-secret-jwt-key}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      - DEEPSEEK_BASE_URL=${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      - DEEPSEEK_MODEL=${DEEPSEEK_MODEL:-deepseek-v4-flash}
      - CLIENT_URL=${CLIENT_URL:-http://localhost:3000}
      - AGENT_QUEUE_NAME=${AGENT_QUEUE_NAME:-v0-agent-runs}
      - AGENT_MODEL=${AGENT_MODEL:-}
      - AGENT_MAX_REPAIR_ATTEMPTS=${AGENT_MAX_REPAIR_ATTEMPTS:-2}
      - AGENT_WORKSPACE_ROOT=${AGENT_WORKSPACE_ROOT:-/tmp/v0-agent-runs}
      - AGENT_CONTEXT_CHAR_LIMIT=${AGENT_CONTEXT_CHAR_LIMIT:-120000}
      - AGENT_VALIDATION_NPM_CACHE_ROOT=/var/cache/v0-agent/npm
      - AGENT_VALIDATION_DEPENDENCY_CACHE_ROOT=/var/cache/v0-agent/dependencies
      - ARTIFACT_STORE_DRIVER=shared-filesystem
      - ARTIFACT_STORE_ROOT=/var/lib/open-v0/artifacts
      - SANDBOX_PROVIDER=fake
      - SANDBOX_LOCAL_ENABLED=false
      - NODE_ENV=production
    volumes:
      - agent_validation_cache:/var/cache/v0-agent
      - artifact_store:/var/lib/open-v0/artifacts
    depends_on:
      - mongodb
      - redis
    networks:
      - v0-network

  worker:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    restart: unless-stopped
    command: npm run start:worker --workspace @v0/server
    environment:
      - MONGODB_URI=mongodb://admin:password@mongodb:27017/v0-by-kimi?authSource=admin
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=${JWT_SECRET:-your-super-secret-jwt-key}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      - DEEPSEEK_BASE_URL=${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      - DEEPSEEK_MODEL=${DEEPSEEK_MODEL:-deepseek-v4-flash}
      - AGENT_QUEUE_NAME=${AGENT_QUEUE_NAME:-v0-agent-runs}
      - AGENT_MODEL=${AGENT_MODEL:-}
      - AGENT_MAX_REPAIR_ATTEMPTS=${AGENT_MAX_REPAIR_ATTEMPTS:-2}
      - AGENT_WORKSPACE_ROOT=${AGENT_WORKSPACE_ROOT:-/tmp/v0-agent-runs}
      - AGENT_CONTEXT_CHAR_LIMIT=${AGENT_CONTEXT_CHAR_LIMIT:-120000}
      - ARTIFACT_STORE_DRIVER=shared-filesystem
      - ARTIFACT_STORE_ROOT=/var/lib/open-v0/artifacts
      - SANDBOX_PROVIDER=fake
      - SANDBOX_LOCAL_ENABLED=false
      - NODE_ENV=production
    volumes:
      - agent_validation_cache:/var/cache/v0-agent
      - artifact_store:/var/lib/open-v0/artifacts
    depends_on:
      - mongodb
      - redis
    networks:
      - v0-network

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:3001}
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-3000}:80"
    depends_on:
      - server
    networks:
      - v0-network

  artifact-reconciler:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    profiles:
      - maintenance
    restart: "no"
    command: npm run start:reconcile:artifacts --workspace @v0/server
    environment:
      - MONGODB_URI=mongodb://admin:password@mongodb:27017/v0-by-kimi?authSource=admin
      - ARTIFACT_STORE_DRIVER=shared-filesystem
      - ARTIFACT_STORE_ROOT=/var/lib/open-v0/artifacts
      - NODE_ENV=production
    volumes:
      - artifact_store:/var/lib/open-v0/artifacts
    depends_on:
      - mongodb
    networks:
      - v0-network

volumes:
  mongodb_data:
  agent_validation_cache:
  artifact_store:

networks:
  v0-network:
    driver: bridge
