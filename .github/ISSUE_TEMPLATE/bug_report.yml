name: Bug 报告
description: 提交可复现的产品、安装或运行问题
title: "[Bug] "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        请先移除 API Key、Token、Cookie、内部地址和用户数据。
  - type: input
    id: version
    attributes:
      label: 版本
      description: Release、commit 或分支
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: 环境
      description: 操作系统、CPU 架构、Node 和 Docker 版本
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 复现步骤
      description: 提供最小、完整、可重复的步骤
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期行为
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际行为与脱敏日志
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: 信息安全确认
      options:
        - label: 我已移除密钥、Token、Cookie、内部地址和用户数据
          required: true
