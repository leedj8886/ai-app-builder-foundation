name: CI

on:
  push:
    branches:
      - main
      - agent/v0-clone
  pull_request:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.19.0
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Audit dependencies
        run: npm run audit:dependencies
      - name: Check repository readiness
        run: npm run test:readiness
      - name: Lint workspaces
        run: npm run lint
      - name: Type-check workspaces
        run: npm run type-check
      - name: Test server
        run: npm run test --workspace @ai-app-builder-foundation/server
      - name: Test web
        run: npm run test --workspace @ai-app-builder-foundation/web
      - name: Build production bundles
        run: npm run build
      - name: Validate Compose configuration
        run: docker compose --env-file .env.example config --quiet

  integration:
    name: Integration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.19.0
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run server integration tests
        run: npm run test:integration --workspace @ai-app-builder-foundation/server

  smoke:
    name: Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.19.0
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Run complete Docker smoke
        run: npm run test:smoke

  external-preview:
    name: External Preview Monitor
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.19.0
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Monitor external Sandpack fallback
        run: npm run test:smoke:external
